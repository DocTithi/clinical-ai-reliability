name: PyPI Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pypi-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package from PyPI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir clinical-ai-reliability==0.1.1

      - name: Verify package import and version
        run: |
          python -c "import clinical_ai_reliability as car; print('CAR version:', car.__version__); assert car.__version__ == '0.1.1'"

      - name: Verify CLI
        run: |
          car-evaluate --help
